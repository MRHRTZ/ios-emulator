name: Windows host tests

on:
  push:
    branches: [dev/window-native]
    paths:
      - 'emulator*.py'
      - 'tools/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/windows-host-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: tools
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate installed dependency consistency
        run: python -m pip check
      - name: Run host regressions with Qt
        run: python -m unittest discover -s tests -v
      - name: Compile Python entry points
        run: python -m py_compile emulator.py emulator_gui.py
